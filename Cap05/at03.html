<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capitulo 05 - Atividade 03</title>
</head>

<body>
  <header>
    <h1>Fomulário de matrícula</h1>
  </header>
  <main>
    <p style="color:red">* Campos obrigatórios</p>
    
    <form action="https://httpbin.org/post" method="POST">
      <section title="Campus de dados pessoais">
        <fieldset>
          <legend>Dados pessoais</legend>
        
          <p><label for="nome"><span style="color:red">*</span>Nome Completo</label>
            <input
              type="text"
              id="nome" name="nome"
              required
              minlength="5"
              maxlength="100">
         </p>
        
         <p><label for="cpf"><span style="color:red">*</span>CPF</label>
           <input
             type="text"
             id="cpf" name="cpf"
             required
             pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
             placeholder="000.000.000-00"
             title="CPF noformato000.000.000-00">
         </p>
        
          <p><label for="telefone">Telefone</label>
            <input
              type="tel"
              id="telefone" name="telefone"
              pattern="\(\d{2})\s\d{4,5}-\d{4}"
              placeholder="(82) 99999-9999">
          </p>
        
          <p><label for="email"><span style="color:red">*</span>E-mail</label>
            <input
              type="email"
              id="email" name="email"
              required>
          </p>
        </fieldset>
      </section>
      
      <section title="Campus Acadêmico">
        <fieldset>
          <legend>Dados acadêmicos</legend>
          
          <p><label for="curso"><span style="color:red">*</span>Curso</label>
            <select  id="curso" name="curso" required>
              <option value="">Selecione um curso</option>
              
              <optgroup label="Computação">
                <option value="sitm-informacao">Sistemas de Informação</option>
                <option value="cien-computacao">Ciência da Computação</option>
                <option value="eng-computacao">Engenharia da Computação</option>
              </optgroup>
              
              <optgroup label="Gestão">
                <option value="adm">Administração</option>
                <option value="cien-contaveis">Ciências Contáveis</option>
              </optgroup>
            </select>
          </p>
          <fieldset>
            <legend>Período</legend>
            
              <input
                type="radio"
                id="matutino" name="periodo"
                value="matutino">
              <label for="matutino">Matutino</label>
            
            <br>
            
              <input
                type="radio"
                id="vespertino" name="periodo"
                value="vespertino">
              <label for="vespertino">Vespertino</label>
            
            <br>
            
            <input
              type="radio"
              id="noturno" name="periodo"
              value="noturno">
            <label for="noturno">Noturno</label>
          </fieldset>
          
          <p><label for="ano_ingresso" class="label-obrigatorio">Ano de Ingresso Pretendido</label>
            <input
              type="number"
              id="ano_ingresso" name="ano_ingresso"
              min="2025"
              max="2030"
              required>
          </p>
        </fieldset>
      </section>
      
      <section title="Interesses na área">
        <fieldset>
          <legend>Áreas de interesses</legend>
          
          <p>
          <input type="checkbox" id="banco_dados" name="interesses[]" value="banco_dados">
          <label for="banco_dados">Banco de Dados</label><br>
          
          <input type="checkbox" id="desenv_web" name="interesses[]" value="desenv_web"> 
          <label for="desenv_web">Desenvolvimento Web</label><br>

          <input type="checkbox" id="int_artificial" name="interesses[]" value="int_artificial">
          <label for="int_artificial">Inteligência Artificial</label>
         </p> 
        </fieldset>
      </section>
      
      <p>
        <button type="submit">Enviar matrícula</button>
        <button type="reset">Limpar formulário</button>
      </p>
    </form>
  </main>
</body>
</html>
