<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capitulo 05 - Atividade 03</title>
</head>

<body>
  <header>
    <h1>Formulário de Pesquisa Acadêmica</h1>
  </header>
  
  <main>
    <p style="color:red">* Campos obrigatórios</p>
    
    <form action="https://httpbin.org/post" method="POST" novalidate>
      <fieldset>
        <legend>Perfil do estudante</legend>
        
        <p><label for="nome"><span style="color:red" aria-hidden="true">*</span>Nome Completo</label>
          <input
            type="text"
            id="nome" name="nome"
            aria-required="true"
            autocomplete
          >
        </p>
        
        <p><label for="matricula"><span style="color:red" aria-hidden="true">*</span>Número de matrícula</label>
          <input
            type="text"
            id="matricula" name="matricula"
            pattern="\d{7}"
            aria-required="true"
          >
        </p>
        
        <p><label for="email"><span style="color:red" aria-hidden="true">*</span>E-mail institucional</label>
          <input
            type="email"
            id="email" name="email"
            pattern="[a-zA-Z0-9._%+\-]+@ifal\.edu\.br"
            autocomplete=""
            aria-required="true"
            aria-invalid="false"
            aria-describedby="erro-email"
            onblur="validarEmail(this)"
          >
        </p>
        
        <p id="erro-email" role="alert"></p>
        
        <p><label for="periodo">Período atual</label>
          <select id="periodo" name="periodo" required aria-describadby="dica-periodo">
            <option value="">Escolha o período</option>
            
            <option value="1p">1° período</option>
            <option value="2p">2° período</option>
            <option value="3p">3° período</option>
            <option value="4p">4° período</option>
            <option value="5p">5° período</option>
            <option value="6p">6° período</option>
            <option value="7p">7° período</option>
            <option value="8p">8° período</option>
          </select>
          
          <br>
          
          <smal id="dica-periodo">Ctrl (ou Cmd no Mac) para selecionar o período</smal>
        </p>
        
        <fieldset>
          <legend>Turno</legend>
          
          <p>           
            <label for="manha">Manhã</label>
            <input type="radio" id="manha" name="turno" value="manha">           
            
            <br>
          
           <label for="tarde">Tarde</label>
            <input type="radio" id="tarde" name="turno" value="tarde">           
            
            <br>
          
           <label for="noite">Noite</label>
            <input type="radio" id="noite" name="turno" value="noite">           
          </p>
        </fieldset>
      </fieldset>
      
      <fieldset>
        <legend>Perfil Tecnológico</legend>
        
        <fieldset>
          <legend>Tecnologias que conhece</legend>
          
          <p>
            <label for="python">Python</label>
            <input
            type="checkbox"
            id="python" name="conhecimento[]"
            value="python"
            >
            
            <br>
            
            <label for="c++">C++</label>
            <input
              type="checkbox"
              id="c++" name="conhecimento[]"
              value="c++"
            >
            
            <br>
            
            <label for="javascript">JavaScript</label>
            <input
              type="checkbox"
              id="javascript" name="conhecimento[]"
              value="js"
            >
            
            <br>
            
            <label for="php">PHP</label>
            <input
              type="checkbox"
              id="php" name="conhecimento[]"
              value="php"
            >
            
            <br>
            
            <label for="banco_dados">Banco de dados</label>
            <input
              type="checkbox"
              id="banco_dados" name="conhecimento[]"
            >
          </p>
        </fieldset>
        
        <p><label for="anos_programacao">Anos de experiência com programação</label>
          <input
            type="number"
            id="anos_programacao" name="anos_programacao"
            min="0" max="30"
          >
        </p>
        
        <p><label for="url">LinkedIn</label>
          <input
            type="url"
            id="url" name="url"
            placeholder="https://"
          >
        </p>
      </fieldset>
      
      <fieldset>
        <legend>Avaliação da disciplina</legend>
        
        <p><label for="nota">Nota para disciplina : <span id="valor_nota">5</span>/10</label>
          <input
            type="range"
            id="nota" name="nota"
            min="0" max="10"
            step="1"
            value="5"
          >
        </p>
        
        <fieldset>
          <legend>Satisfação com o material didático</legend>
          
          <p>
            <label for="muito_satisfeito">Muito satisfeito</label>
            <input type="radio" id="muito_satisfeito" name="material_didatico" value="muito_satisfeito">
            
            <br>
            
            <label for="satisfeito">Satisfeito</label>
            <input type="radio" id="satisfeito" name="material_didatico" value="satisfeito">
            
            <br>
            
            <label for="neutro">Neutro</label>
            <input type="radio" id="neutro" name="material_didatico" value="neutro">
            
            <br>
            
            <label for="insatisfeito">Insatisfeito</label>
            <input type="radio" id="insatisfeito" name="material_didatico" value="insatisfeito">
            
            <br>
            
            <label for="muito_insatisfeito">Muito insatisfeito</label>
            <input type="radio" id="muito_insatisfeito" name="material_didatico" value="muito_insatisfeito">
          </p>
                           
        </fieldset>
        
        <p><label for="sugestao">Sugestões de melhoria</label>
           <textarea id="sugestao" name="sugestao" rows="6" maxlength="1000"></textarea>
        </p>
        
        <p><label for="data_preenchimento">Data de preenchimento</label>
          <input
            type="date"
            id="data_preenchimento" name="data"
            required
          >
        </p>
      </fieldset>
      
      <fieldset>
        <legend>Consentimento e envio</legend>
        
        <p><label for="consentimento">Autorização de uso dos dados para fins acadêmicos</label>
          <input type="checkbox" id="consentimento" name="consentimento" value="aceito" required>
        </p>
        
        <input type="hidden" name="pesquisa_id" value="PWEB1-2026-1">
        
        <button type="submit">Enviar</button>
      </fieldset>
    </form>
  </main>
  
  <footer>
    
  </footer>
  
  <script>
  function validarEmail(campo) {
   const erro = document.getElementById('erro-email');
   if (!campo.value.endsWith('@ifal.edu.br')) {
     erro.textContent = 'Informe seu e-mail institucional (@ifal.edu.br)';
     campo.setAttribute('aria-invalid', 'true');
   } 
    else {
      erro.textContent = '';
      campo.setAttribute('aria-invalid', 'false');
    }
 }
  
  document.getElementById('data_preenchimento').max =
  new Date().toISOString().split('T')[0];
  </script>
</body>
</html>
