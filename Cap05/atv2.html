<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário</title>
</head>

<body>
  <header>
    <h1>Cadastro de Usuário</h1>
  </header>
  <main>
    <form action="https://httpbin.org/post" method="POST">
      <p><label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome">
      </p>
      
      <p><label for="email">E-mail</label>
        <input
          type="email"
          id="email" name="email"
          required>
      </p>
      
      <p><label for="senha">Senha</label>
        <input
          type="password"
          id="senha" name="senha"
          required
          minlength="8">
      </p>
      
      <p><label for="nascimento">Data de Nascimento</label>
        <input
          type="date"
          id="nascimento" name="nascimento"
          required>
      </p>
      
        <fieldset>
          <legend>Gênero</legend>
          
          <label for="masculino">Masculino</label>
          <input
            type="radio"
            id="masculino" name="genero"
            value="masculino">
          
          <br>
          
          <label for="feminino">Feminino</label>
          <input
            type="radio"
            id="feminino" name="genero"
            value="feminino">
          
          <br>
          
          <label for="outro">Outro</label>
          <input
            type="radio"
            id="outro" name="genero"
            value="outro">
          
          <br>
          
          <label for="prefiro_nao_informar">Prefiro não informar</label>
          <input
            type="radio"
            id="prefiro_nao_informar" name="genero"
            value="prefiro_nao_informar">
        </fieldset>
      
         <input
          type="checkbox"
          id="aceite" name="aceite"
          value="sim"
          required>
      <label for="aceite">Aceito todos os termos</label>
      
      <p><button type="submit">Criar conta</button>
      <button type="reset">Limpar campus</button>
     </p>
    </form>
  </main>
  <footer>
    <a href="../activity.html">Voltar</a>
  </footer>
</body>
</html>
