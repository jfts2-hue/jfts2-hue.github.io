<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capitulo 5  Atividade 3</title>
</head>

<body>
  <header>
    <h1>Semana de Tecnologia IFAL</h1>
  </header>
  
  <main>
    <p style="color:red">* Campos obrigatórios</p>
    
    <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">
      <fieldset>
        <legend>Identificação do participante</legend>
        
        <p><label for="nome"><span style="color:rgb(10, 105, 89)" aria-hidden="true">*</span>Nome Completo</label>
          <input
            type="text"
            id="nome" name="nome"
            required
          >
        </p>
        
        <p><label for="email"><span style="color:rgba(85, 19, 105, 0.363)" aria-hidden="true">*</span>E-mail institucional</label>
          <input
            type="email"
            id="email" name="email"
            required
          >
        </p>
        
        <p><label for="cidade">Cidade de Origem</label>
          <input
            type="text"
            id="cidade" name="cidade"
            list="sugestoes-cidade"
          >
          <datalist id="sugestoes-cidade">
            <option>Maceió</option>
            <option>Rio Largo</option>
            <option>União dos Palmares</option>
            <option>Murici</option>
            <option>Arapiraca</option>
            <option>Penedo</option>
            <option>Atalaia</option>
            <option>Viçosa</option>
          </datalist>
        </p>
        
        <p><label for="foto">Foto para crachá</label>
          <input
            type="file"
            id="foto" name="foto"
            accept="image/jpeg, image/png"
            aria-describedby="dica-foto"           
          >
          
          <small id="dica-foto">Formatos aceitos: JPG e PNG. Tamanho máximo: 2 MB.</small>
        </p>
      </fieldset>
      
      <fieldset>
        <legend>Preferências para evento</legend>
        
        <p><label for="chegada">Data e hora preferida para chegada</label>
          <input
            type="datetime-local"
            id="chegada" name="chegada"
          >
        </p>
        
        <p><label for="experiencia">Nível de experiência em programação <span id="valor-experiencia">5</span>/10</label>
          <input
            type="range"
            id="experiencia" name="experiencia"
            min="0" max="10"
            step="1"
            value="5"
            oninput="document.getElementById('valor-experiencia').textContent = this.value"
          >
        </p>
        
        <p><label for="cor_camiseta">Cor da camiseta de preferencia</label>
          <input
            type="color"
            id="cor_camiseta" name="cor_camiseta"
            value="#1a73e8"
          >
        </p>
        
        <p><label for="oficinas">Oficinas :</label><br>
          <select multiple size="4" id="oficinas" name="oficinas[]" aria-describedby="dica-selecao">
            <option>Github</option>
            <option>Robótica</option>
            <option>Cibersegurança</option>
            <option>Inteligência Artificial</option>
            <option>Linguagem Python</option>
          </select>
          
          <small id="dica-selecao">Use Ctrl (ou Cmd no Mac) para selecionar mais de uma oficina.</small>
        </p>
      </fieldset>
      
      <input type="hidden" name="edicao" value="2026" />
      
      <p>
        <button type="submit">Confirmar inscrição</button>
      </p>
    </form>
  </main>
  
  <footer>
    <a href="../atividades">Voltar a página de atividades</a>
  </footer>
</body>
</html>
